    --line: #3d3a35; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --brand: #e08a69; --brand-soft: #3d2a22;
    --input: #7aa7f0;   --input-soft: #1f2c42;
    --think: #b196ee;   --think-soft: #2d2540;

    --guard: #e0ad5c;   --guard-soft: #3a2f1c;

  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 16px 48px; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  :root { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "logo text theme";

  header .logo { grid-area: logo; }
  header .htext { grid-area: text; }
  header .theme { grid-area: theme; }

  .theme button { border: 0; background: transparent; color: var(--muted); border-radius: 9px; padding: 6px 10px; cursor: pointer;

  .theme button:hover { color: var(--text); }

  .theme button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .logo { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; flex: none;

  .copy { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--muted); cursor: pointer;

  .copy:hover { color: var(--text); background: var(--surface); }

  .score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; background: var(--surface);

  .tb { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  .lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .input { background: var(--bg-accent); border-radius: 10px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; min-width: 0; }
  .box.exp { background: var(--output-soft); border-color: transparent; }
  .box.got { background: var(--handoff-soft); border-color: transparent; }

  .box ul { margin: 4px 0 0; padding-left: 18px; }

  .quote { white-space: pre-wrap; overflow-wrap: anywhere; }
  .why { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
  .fix { display: flex; flex-direction: column; gap: 6px; background: var(--brand-soft); border-radius: 12px; padding: 10px 12px; }
  .fix .txt { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--text); }

  .full { font-size: 13.5px; }
  .full summary { cursor: pointer; color: var(--muted); }

  .cta { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 18px; background: var(--surface); border: 1px solid var(--line);

  .empty { text-align: center; color: var(--muted); padding: 30px; border: 1px dashed var(--line); border-radius: 16px; }

    .theme button { padding: 6px 8px; }
    .cmp { grid-template-columns: 1fr; }
    .score { grid-template-columns: 1fr; gap: 10px; }
  }
</style>

  sort: '<path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/>'
});

/* Theme: "system" follows the device setting; "light"/"dark" override it. Saved per browser, shared with the Flow Preview. */
function currentTheme() { return document.documentElement.dataset.theme || "system"; }
function setTheme(t) {
  if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { if (t === "system") localStorage.removeItem("agent-builder-theme"); else localStorage.setItem("agent-builder-theme", t); } catch (e) {}
}
function themeToggle() {
  const g = el("div", "theme"); g.setAttribute("role", "group"); g.setAttribute("aria-label", "Color theme");
  [["system", "monitor", "System"], ["light", "sun", "Light"], ["dark", "moon", "Dark"]].forEach(([v, ic, label]) => {
    const b = el("button"); b.type = "button"; b.title = label + " theme"; b.setAttribute("aria-label", label + " theme");
    b.setAttribute("aria-pressed", currentTheme() === v ? "true" : "false");
    b.append(icon(ic, "sm"), el("span", null, label));
    b.addEventListener("click", () => { setTheme(v); g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false")); });
    g.append(b);
  });
  return g;
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function icon(name, cls) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "i" + (cls ? " " + cls : "")); s.setAttribute("aria-hidden", "true");
  s.innerHTML = ICONS[name] || ICONS.sparkles; return s;
}
function fmtDate(s) {
  if (!s) return "";
  const d = new Date(s.length <= 16 ? s + ":00" : s);
  return isNaN(d) ? s : d.toLocaleDateString(undefined, {year: "numeric", month: "short", day: "numeric"});
}
/* ---------- copy to clipboard (works on file:// pages and in artifacts) ---------- */
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = el("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.append(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}
function copyButton(text, label) {
  const b = el("button", "copy"); b.type = "button";
  const name = label || "Copy";
  b.setAttribute("aria-label", name + ": " + text); b.title = "Copy “" + text + "”";
  const show = (ic, t) => { b.textContent = ""; b.append(icon(ic, "sm"), el("span", null, t)); };
  show("copy", name);
  b.addEventListener("click", async (ev) => {
    ev.stopPropagation();
    const ok = await copyText(text);
    show(ok ? "check" : "alert", ok ? "Copied" : "Select & copy");
    b.classList.toggle("done", ok);
    if (!ok) { const code = b.parentElement && b.parentElement.querySelector("code"); if (code) { const r = document.createRange(); r.selectNodeContents(code); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } }
    setTimeout(() => { show("copy", name); b.classList.remove("done"); }, 1600);
  });
  return b;
}
/* A phrase the user can paste into the chat, with its own copy button. */
function phrase(text) {
  const w = el("span", "phrase"); w.append(el("code", null, text), copyButton(text)); return w;
}


const V = {
  pass:        {label: "Passed",        icon: "check"},
  fail:        {label: "Failed",        icon: "alert"},
  couldnt_run: {label: "Couldn't run",  icon: "help"},
  not_graded:  {label: "Not graded",    icon: "help"}
};
const TYPE = {everyday: "Everyday", tricky: "Tricky", boundary: "Boundary", format: "Format"};
const results = (DATA.results || []).slice().sort((a, b) => order(a) - order(b) || String(a.id).localeCompare(String(b.id), undefined, {numeric: true}));
function order(r) { return {fail: 0, couldnt_run: 1, not_graded: 2, pass: 3}[r.verdict] ?? 4; }
const agent = DATA.agent || {}, run = DATA.run || {};
const count = k => results.filter(r => r.verdict === k).length;
let filter = count("fail") ? "fail" : "all";

function render() {
  const app = document.getElementById("app"); app.textContent = "";
  document.title = (agent.name || "Agent") + " · Test report";

  const head = el("header");
  const logo = el("div", "logo"); logo.style.fontSize = "28px"; logo.textContent = agent.emoji || "🧪";
  const ht = el("div", "htext"); ht.append(el("h1", null, "Test report: " + (agent.name || agent.id || "your agent")));
  const meta = el("div", "meta");
  if (run.date) meta.append(el("span", null, "Run " + fmtDate(run.date)));
  if (run.method) meta.append(el("span", run.method === "simulated" ? "sim" : "", run.method === "live" ? "Live: ran the real agent" :
      run.method === "simulated" ? "Simulated: checks the instructions, not the live setup" : run.method === "manual" ? "Checked by hand" : run.method));
  if (agent.id) meta.append(el("span", null, "id: " + agent.id));
  ht.append(meta);
  head.append(logo, ht, themeToggle()); app.append(head);

  if (!results.length) { app.append(el("div", "empty", "No test results yet.")); return; }

  const p = count("pass"), f = count("fail"), c = count("couldnt_run") + count("not_graded"), n = results.length;
  const score = el("section", "score"); score.setAttribute("aria-label", "Summary");
  const big = el("div", "big"); big.append(document.createTextNode(p + "/" + n), el("small", null, " passed"));
  const right = el("div");
  right.append(el("div", "verdict " + (f || c ? "bad" : "ok"), f ? f + (f === 1 ? " test needs" : " tests need") + " a fix." : c ? "Some tests couldn't run." : "Everything passed. Your agent is behaving as expected."));
  const seg = el("div", "seg"); seg.setAttribute("role", "img"); seg.setAttribute("aria-label", p + " passed, " + f + " failed, " + c + " couldn't run");
  [["p", p], ["f", f], ["c", c]].forEach(([k, v]) => { if (v) { const s = el("span", k); s.style.width = (100 * v / n) + "%"; seg.append(s); } });
  const lg = el("div", "legend");
  [["var(--output)", p + " passed"], ["var(--handoff)", f + " failed"], ["var(--muted)", c + " couldn't run"]].forEach(([col, t], i) => {
    if (i === 2 && !c) return; const s = el("span"); const dot = el("i"); dot.style.background = col; s.append(dot, document.createTextNode(t)); lg.append(s); });
  right.append(seg, lg); score.append(big, right); app.append(score);

  const chips = el("div", "chips");
  [["all", "All (" + n + ")"], ["fail", "Failed (" + f + ")"], ["pass", "Passed (" + p + ")"]].concat(c ? [["couldnt_run", "Couldn't run (" + c + ")"]] : [])
    .forEach(([k, l]) => { const b = el("button", "chip", l); b.type = "button"; b.setAttribute("aria-pressed", filter === k ? "true" : "false");
      b.addEventListener("click", () => { filter = k; render(); }); chips.append(b); });
  app.append(chips);

  const list = el("div", "list");
  const shown = results.filter(r => filter === "all" || r.verdict === filter || (filter === "couldnt_run" && r.verdict === "not_graded"));
  if (!shown.length) list.append(el("div", "empty", "No tests in this group."));
  shown.forEach(r => list.append(testCard(r)));
  app.append(list);

  const cta = el("div", "cta");
  const id = agent.id || "my agent";
  cta.append(el("span", null, f ? "To fix the failures, paste this into your chat with Claude:" : "To check again after a change, paste this into your chat:"),
    phrase(f ? "fix failing tests for " + id : "run tests for " + id), phrase("add a test for " + id));
  app.append(cta);
}

function testCard(r) {
  const v = V[r.verdict] || V.not_graded;
  const open = r.verdict !== "pass";
  const wrap = el("details", "t " + (V[r.verdict] ? r.verdict : "not_graded"));
  wrap.open = open;
  const sum = el("summary");
  const st = el("div", "st"); st.append(icon(v.icon)); st.setAttribute("aria-label", v.label);
  const tt = el("div", "tt"); const h = el("h3");
  h.append(el("span", "id", r.id || ""), document.createTextNode(" " + (r.name || "")));
  if (r.type) h.append(el("span", "pill", TYPE[r.type] || r.type));
  if (r.source === "you") h.append(el("span", "pill you", "Your test")); else if (r.source === "your chat") h.append(el("span", "pill you", "From your chat"));
  tt.append(h, el("p", null, v.label + (r.reason ? ": " + r.reason : "")));
  const chev = el("span", "chev"); chev.append(icon("chevron"));
  sum.append(st, tt, chev); wrap.append(sum);

  const body = el("div", "tb");
  const inp = el("div"); inp.append(el("div", "lbl", "What was asked"));
  const ib = el("div", "input", r.input || ""); inp.append(ib); body.append(inp);

  const cmp = el("div", "cmp");
  const exp = el("div", "box exp"); exp.append(el("div", "lbl", "What we expected"));
  if (r.expected_output) exp.append(el("div", "quote", r.expected_output));
  if ((r.must_include || []).length) { exp.append(el("div", "sub", "Should:")); const ul = el("ul"); r.must_include.forEach(x => ul.append(el("li", null, x))); exp.append(ul); }
  if ((r.must_not_include || []).length) { exp.append(el("div", "sub", "Should not:")); const ul = el("ul"); r.must_not_include.forEach(x => ul.append(el("li", null, x))); exp.append(ul); }
  const got = el("div", "box got"); got.append(el("div", "lbl", r.verdict === "pass" ? "What it answered" : "What it actually did"));
  got.append(el("div", "quote", r.evidence ? "“" + r.evidence + "”" : (r.answer ? clip(r.answer, 400) : "(no answer)")));
  cmp.append(exp, got); body.append(cmp);

  if (r.suggested_fix && r.verdict !== "pass") {
    const fx = el("div", "fix"); const t = el("div", "txt"); t.append(icon("sparkles", "sm"), el("span", null, r.suggested_fix));
    fx.append(el("div", "lbl", "Suggested fix"), t, el("div", null)); fx.lastChild.append(phrase("apply the suggested fix for " + (r.id || "this test") + " on " + (agent.id || "my agent")));
    body.append(fx);
  }
  if (r.answer) {
    const full = el("details", "full"); full.append(el("summary", null, "Show the full answer"), el("div", "quote", r.answer)); body.append(full);
  }
  wrap.append(body);
  return wrap;
}
function clip(s, n) { s = String(s); return s.length <= n ? s : s.slice(0, n).replace(/\s+\S*$/, "") + " …"; }

render();
</script>
