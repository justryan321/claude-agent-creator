/* ---------- copy to clipboard (works on file:// pages and in artifacts) ---------- */
async function copyText(text) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch (e) {}
  try {
    const ta = el("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.append(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch (e) { return false; }
}
function copyButton(text, label) {
  const b = el("button", "copy"); b.type = "button";
  const name = label || "Copy";
  b.setAttribute("aria-label", name + ": " + text); b.title = "Copy “" + text + "”";
  const show = (ic, t) => { b.textContent = ""; b.append(icon(ic, "sm"), el("span", null, t)); };
  show("copy", name);
  b.addEventListener("click", async (ev) => {
    ev.stopPropagation();
    const ok = await copyText(text);
    show(ok ? "check" : "alert", ok ? "Copied" : "Select & copy");
    b.classList.toggle("done", ok);
    if (!ok) { const code = b.parentElement && b.parentElement.querySelector("code"); if (code) { const r = document.createRange(); r.selectNodeContents(code); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } }
    setTimeout(() => { show("copy", name); b.classList.remove("done"); }, 1600);
  });
  return b;
}

/* ---------- how to use it (mirrors how_steps() in agent_registry.py) ---------- */
function startPhrase(a) {
  const u = a.usage || {};
  if (u.start && String(u.start).trim()) return String(u.start).trim();
  const types = (a.destinations || []).map(d => d.type);
  if (types.includes("skill")) return "/" + a.id;
  if (types.includes("subagent")) return "Use the " + a.id + " agent to <what you need>";
  return null;
}
/* Each step: [text, optional thing to copy]. */
function howSteps(a) {
  const start = startPhrase(a) || "your first request", out = [];
  const where = a.scope === "project" ? ["Open Claude Code in your " + (projName(a) || "project") + " project (it only works there)."]
    : ["Open Claude Code in any project."];
  (a.destinations || []).forEach(d => {
    const loc = String(d.location || "");
    if (d.type === "subagent") out.push({type: d.type, steps: [where, ["Type this:", start],
      ["Or type @ and pick " + a.id + " from the list."], ["To make it the main agent for a whole session, start Claude Code with:", "claude --agent " + a.id]]});
    else if (d.type === "skill") out.push({type: d.type, steps: [where, ["Type the slash command, or just ask for the task:", start === "/" + a.id ? start : "/" + a.id],
      ...(start !== "/" + a.id ? [["For example:", start]] : []),
      ["On claude.ai (if you uploaded the skill): turn it on under Settings → Capabilities → Skills, then ask in any chat."]]});
    else if (d.type === "claude-ai-project") {
      const name = loc.includes(":") ? loc.split(":").slice(1).join(":").trim() : (a.name || a.id);
      out.push({type: d.type, steps: [["Go to claude.ai and click Projects."], ["Open the project “" + name + "”."],
        ["Start a new chat inside the project and type:", start]]});
    }
    else if (d.type === "standalone-app") out.push({type: d.type, steps: [["Open a terminal in its folder:", loc || "the agent's folder"],
      ["Turn on its Python environment (Windows: .venv\\Scripts\\Activate.ps1):", "source .venv/bin/activate"],
      ["Start it:", "python agent.py"], ["Then type:", start], ["Type quit to stop."]]});
  });
  return out;
}

/* ---------- what needs attention ---------- */
function issues(a) {
  if (a.status === "archived") return [];
  const out = [], t = a.tests || {};
  if (a._unclear) out.push({sev: 3, icon: "alert", text: "Location is unclear (saved without a full path)", fix: "update " + a.id});
  else if ((a._missing || []).length) out.push({sev: 3, icon: "alert", text: "File missing: " + a._missing[0], fix: "fix the missing file for " + a.id});
  if (testState(a) === "fail") out.push({sev: 3, icon: "alert", text: "Failed " + (t.total - t.passed) + " of " + t.total + " tests" + (t.method === "simulated" ? " (simulated)" : ""), fix: "fix failing tests for " + a.id});
  if (testState(a) === "none") out.push({sev: 1, icon: "help", text: "Not tested yet", fix: "add tests for " + a.id});
  return out;
}
function severity(a) { return issues(a).reduce((m, i) => Math.max(m, i.sev), 0); }

const SORTS = {
  attention: {label: "Needs attention first", fn: (a, b) => severity(b) - severity(a) || byUpdated(a, b)},
  updated:   {label: "Recently updated",      fn: (a, b) => byUpdated(a, b)},
  name:      {label: "Name (A–Z)",            fn: (a, b) => String(a.name || a.id).localeCompare(String(b.name || b.id))}
};
function byUpdated(a, b) { return String(b.updated || "").localeCompare(String(a.updated || "")); }

  if (a.project) { const p = el("div", "path"); p.append(el("span", "what", "Project folder"), el("code", null, a.project), copyButton(a.project)); w.append(p); }
  if (!usableHere(a)) w.append(el("p", "muted", "Only works inside " + (projName(a) || "its project") + ". Open that project in Claude Code to use it."));
  (a.destinations || []).filter(d => d.type === "claude-ai-project").forEach(d => w.append(el("p", "muted", "☁️ " + (d.location || "On claude.ai"))));

  // Files
  const files = a._paths || [];
  if (files.length) {
    const f = section("Files on this computer", "file");
    files.forEach(x => { const p = el("div", "path" + (x.exists ? "" : " gone"));
      p.append(el("span", "what", x.what + (x.exists ? "" : " (missing)")), el("code", null, x.path), copyButton(x.path)); f.append(p); });
  }

  // Tests
  const tsec = section("Tests", "check");
  const tl = el("div", "row"); tl.append(testBadge(a));
  if ((a.tests || {}).last_run) tl.append(el("span", "muted", "last run " + fmtDate(a.tests.last_run) + (a.tests.method ? " · " + a.tests.method : "")));
  tsec.append(tl);
  const hist = (a.test_history || []).slice(0, 8);
  if (hist.length > 1) {
    const ul = el("ul", "hist"); ul.setAttribute("aria-label", "Recent test runs");
    hist.forEach(r => { const li = el("li"); const pct = r.total ? Math.round(100 * r.passed / r.total) : 0;
      const bar = el("span", "bar"); const fill = el("span", "fill" + (r.passed === r.total ? " ok" : "")); fill.style.width = pct + "%"; bar.append(fill);
      li.append(el("span", "d", fmtDate(r.last_run)), bar, el("span", "n", r.passed + "/" + r.total)); ul.append(li); });
    tsec.append(ul);
  }
  const links = el("div", "links");
  if (a._report_url) { const l = el("a", "btn"); l.href = a._report_url; l.target = "_blank"; l.rel = "noopener"; l.append(icon("list", "sm"), document.createTextNode("Open test report")); links.append(l); }
  if (a._flow_url) { const l = el("a", "btn"); l.href = a._flow_url; l.target = "_blank"; l.rel = "noopener"; l.append(icon("sparkles", "sm"), document.createTextNode("See how it works")); links.append(l); }
  if (links.childNodes.length) tsec.append(links);

  // Instructions
  if (a._instructions) {
    const s = section("Its instructions (preview)", "book");
    s.append(el("div", "instr", a._instructions), el("p", "muted", "From agent-brief.md. Say “update " + a.id + "” to change them."));
  }

  // Tags & notes
  if ((a.tags || []).length || a.notes) {
    const s = section("Tags & notes", "edit");
    if ((a.tags || []).length) { const r = el("div", "row"); a.tags.forEach(x => r.append(el("span", "tag", "#" + x))); s.append(r); }
    if (a.notes) s.append(el("div", "note", a.notes));
  }

  // Ask the builder
  const ask = section("Ask the builder", "message");
  ask.append(el("p", "muted", "Copy a phrase and paste it into your chat with Claude."));
  const ph = el("div", "phrases col");
  ["how do I use " + a.id, "update " + a.id, testState(a) === "none" ? "add tests for " + a.id : "run tests for " + a.id, "add a test for " + a.id,
   "tag " + a.id + " as work", a.status === "archived" ? "restore " + a.id : "archive " + a.id].forEach(x => ph.append(phrase(x)));
  ask.append(ph);

  drawer.append(inner);
  drawer.showModal();
  close.focus();
}

render();
</script>
</body>
</html>
