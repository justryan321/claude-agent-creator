<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Flow Preview</title>
<script>
  /* Apply the saved theme choice before the page paints, to avoid a flash. */
  try { const t = localStorage.getItem("agent-builder-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
  :root {
    --bg: #f7f5f2;
    --bg-accent: #efe9e1;
    --surface: #ffffff;
    --text: #1f1d1a;
    --muted: #6b665e;
    --line: #ddd6cc;
    --shadow: 0 1px 2px rgba(31,29,26,.06), 0 6px 20px rgba(31,29,26,.06);
    --brand: #c96442;
    --brand-soft: #f6e3da;
    --input: #2f6fd6;   --input-soft: #e3edfc;
    --think: #7a4fd0;   --think-soft: #eee6fb;
    --tool: #0f8f86;    --tool-soft: #dcf3f1;
    --guard: #b7791f;   --guard-soft: #fbefd9;
    --output: #2f8a46;  --output-soft: #e0f2e5;
    --handoff: #c2415d; --handoff-soft: #fbe3e8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1a18; --bg-accent: #24221f; --surface: #2a2825; --text: #f1ede7; --muted: #a8a196;
      --line: #3d3a35; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
      --brand: #e08a69; --brand-soft: #3d2a22;
      --input: #7aa7f0;   --input-soft: #1f2c42;
      --think: #b196ee;   --think-soft: #2d2540;
      --tool: #4cc4ba;    --tool-soft: #17332f;
      --guard: #e0ad5c;   --guard-soft: #3a2f1c;
      --output: #6cc283;  --output-soft: #1c3322;
      --handoff: #ee7d95; --handoff-soft: #3e2028;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1a18; --bg-accent: #24221f; --surface: #2a2825; --text: #f1ede7; --muted: #a8a196;
    --line: #3d3a35; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --brand: #e08a69; --brand-soft: #3d2a22;
    --input: #7aa7f0;   --input-soft: #1f2c42;
    --think: #b196ee;   --think-soft: #2d2540;
    --tool: #4cc4ba;    --tool-soft: #17332f;
    --guard: #e0ad5c;   --guard-soft: #3a2f1c;
    --output: #6cc283;  --output-soft: #1c3322;
    --handoff: #ee7d95; --handoff-soft: #3e2028;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(1200px 500px at 10% -10%, var(--bg-accent), transparent 60%), var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 48px; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.sm { width: 16px; height: 16px; }

  /* Header */
  :root { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  .hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "badge text theme";
    gap: 18px; align-items: center; margin-bottom: 22px; }
  .hero .badge { grid-area: badge; }
  .hero .htext { grid-area: text; }
  .hero .theme { grid-area: theme; align-self: start; }
  .theme { justify-self: end; display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); }
  .theme button { border: 0; background: transparent; color: var(--muted); border-radius: 9px; padding: 6px 10px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; }
  .theme button:hover { color: var(--text); }
  .theme button[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .theme button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .badge {
    width: 68px; height: 68px; border-radius: 20px; flex: none;
    display: grid; place-items: center; font-size: 34px;
    background: linear-gradient(145deg, var(--brand-soft), var(--surface));
    border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .hero h1 { margin: 0; font-size: clamp(22px, 4vw, 30px); line-height: 1.15; letter-spacing: -.01em; }
  .hero p { margin: 4px 0 0; color: var(--muted); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .02em;
    background: var(--brand-soft); color: var(--brand);
  }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .meta span { font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; }

  /* At a glance */
  .glance { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 28px; }
  .gcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .gcard h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
  .gcard ul { margin: 0; padding: 0; list-style: none; }
  .gcard li { padding: 3px 0; font-size: 14px; display: flex; gap: 8px; }
  .gcard li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; margin-top: 8px; flex: none; background: currentColor; opacity: .5; }
  .gcard.can h3 { color: var(--tool); }
  .gcard.wont h3 { color: var(--handoff); }
  .gcard.ask h3 { color: var(--guard); }

  h2.section { display: flex; align-items: center; gap: 10px; font-size: 18px; margin: 0 0 14px; }
  h2.section small { font-weight: 400; color: var(--muted); font-size: 14px; }

  /* Flow */
  .flow { position: relative; margin-bottom: 34px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .85fr); gap: 28px; align-items: center; }
  .step {
    position: relative; display: flex; gap: 14px; align-items: flex-start;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; box-shadow: var(--shadow);
    border-left: 4px solid var(--k);
  }
  .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--k-soft); color: var(--k); }
  .step .num { font-size: 11.5px; font-weight: 700; color: var(--k); letter-spacing: .06em; text-transform: uppercase; }
  .step h4 { margin: 1px 0 2px; font-size: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .chg { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 1px 8px; }
  .chg.new { background: var(--output-soft); color: var(--output); }
  .chg.updated { background: var(--brand-soft); color: var(--brand); }
  .step.changed { box-shadow: 0 0 0 3px var(--brand-soft), var(--shadow); }
  .changes { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line);
    border-left: 4px solid var(--brand); border-radius: 14px; padding: 12px 14px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .changes .ico { background: var(--brand-soft); color: var(--brand); width: 36px; height: 36px; border-radius: 10px; }
  .changes b { display: block; }
  .changes p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .changes ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
  .changes s { color: var(--muted); }
  .gcard li.isnew::after { content: "new"; margin-left: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
    color: var(--output); background: var(--output-soft); border-radius: 999px; padding: 0 6px; align-self: center; }
  .step p { margin: 0; color: var(--muted); font-size: 14px; }
  .k-input   { --k: var(--input);   --k-soft: var(--input-soft); }
  .k-think   { --k: var(--think);   --k-soft: var(--think-soft); }
  .k-tool    { --k: var(--tool);    --k-soft: var(--tool-soft); }
  .k-guard   { --k: var(--guard);   --k-soft: var(--guard-soft); }
  .k-output  { --k: var(--output);  --k-soft: var(--output-soft); }
  .k-handoff { --k: var(--handoff); --k-soft: var(--handoff-soft); }

  .connector { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .85fr); gap: 28px; height: 30px; }
  .connector div { position: relative; }
  .connector div:last-child::before, .connector div:last-child::after { display: none; }
  .connector div::before { content: ""; position: absolute; left: 37px; top: 2px; bottom: 8px; border-left: 2px solid var(--line); }
  .connector div::after { content: ""; position: absolute; left: 32px; bottom: 2px; border: 6px solid transparent; border-top: 7px solid var(--line); border-bottom: 0; }

  .branch {
    position: relative; display: flex; gap: 12px; align-items: flex-start;
    border: 1.5px dashed var(--k); background: color-mix(in srgb, var(--k-soft) 55%, transparent);
    border-radius: 14px; padding: 12px 14px;
  }
  .branch::before { content: ""; position: absolute; left: -29px; top: 50%; width: 28px; border-top: 2px dashed var(--k); }
  .branch .ico { width: 34px; height: 34px; border-radius: 10px; }
  .branch .when { font-size: 12px; font-weight: 700; color: var(--k); text-transform: uppercase; letter-spacing: .05em; }
  .branch .then { font-size: 14px; }

  /* Next steps */
  .next { display: flex; flex-wrap: nowrap; align-items: stretch; gap: 6px; margin-bottom: 28px; }
  .nstep {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow);
  }
  .nstep .top { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14.5px; }
  .nstep .top .ico { width: 32px; height: 32px; border-radius: 10px; background: var(--bg-accent); color: var(--muted); }
  .nstep p { margin: 0; font-size: 13px; color: var(--muted); }
  .nstep.current { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft), var(--shadow); }
  .nstep.current .top .ico { background: var(--brand-soft); color: var(--brand); }
  .here { align-self: flex-start; font-size: 11px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .06em; }
  .chev { display: grid; place-items: center; color: var(--line); flex: none; width: 16px; }
  .chev svg { width: 16px; height: 16px; }
  @media (max-width: 900px) {
    .next { flex-wrap: wrap; gap: 8px; }
    .nstep { flex: 1 1 150px; }
    .chev { display: none; }
  }

  .cta {
    display: flex; gap: 14px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow);
  }
  .cta .ico { background: var(--brand-soft); color: var(--brand); }
  .cta p { margin: 0; }
  .cta b { color: var(--brand); }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 18px 0 0; font-size: 12.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--k); display: inline-block; }

  @media (max-width: 720px) {
    .hero { grid-template-columns: auto 1fr; grid-template-areas: "badge theme" "text text"; gap: 12px; }
    .hero .theme { align-self: center; }
    .theme button span { display: none; }
    .theme button { padding: 6px 8px; }
    .glance { grid-template-columns: 1fr; }
    .row, .connector { grid-template-columns: 1fr; gap: 10px; }
    .connector div:last-child { display: none; }
    .hero { align-items: flex-start; gap: 14px; }
    .badge { width: 52px; height: 52px; border-radius: 16px; font-size: 26px; }
    .branch { margin-left: 28px; }
    .branch::before { left: -20px; top: -12px; height: calc(50% + 12px); width: 16px; border-top: 0; border-left: 2px dashed var(--k); border-bottom: 2px dashed var(--k); border-bottom-left-radius: 8px; }
    .chev { display: none; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* The Agent Builder replaces everything between the two markers with the agent's flow spec (JSON). */
const FLOW = /*FLOW_DATA_START*/{
  "agent": {
    "name": "Page Summarizer",
    "id": "page-summarizer",
    "emoji": "📄",
    "tagline": "Reviews a web page, summarizes it, and lists the important key items.",
    "home": "Claude Code subagent",
    "for": "Just me"
  },
  "glance": {
    "can": ["Read web pages", "Read files you point to", "Search the web when asked"],
    "wont": ["Add facts that aren't on the page", "Guess when a page can't be loaded"],
    "asks_first": ["Nothing. It only reads, it never changes anything"]
  },
  "steps": [
    {"kind": "input", "icon": "message", "title": "You share a link", "detail": "Paste a URL, point to a file, or paste text, and say \"summarize this\"."},
    {"kind": "tool", "icon": "globe", "title": "Reads the whole page", "detail": "Opens the link and reads all of it before writing anything.",
     "branch": {"kind": "handoff", "icon": "alert", "when": "If the page won't load", "then": "Tells you it couldn't read it (paywall, login) and asks you to paste the text."}},
    {"kind": "think", "icon": "sparkles", "title": "Works out what matters", "detail": "Identifies the type of page and who it's for, then picks out decisions, dates, numbers, and actions."},
    {"kind": "guard", "icon": "shield", "title": "Checks accuracy", "detail": "Sticks to what the page says and quotes numbers and dates exactly.",
     "branch": {"kind": "guard", "icon": "help", "when": "If something is unclear", "then": "Flags it as ambiguous instead of guessing."}},
    {"kind": "output", "icon": "list", "title": "You get the review", "detail": "Title line, 3–5 sentence summary, 5–10 bolded key items, and \"Worth noting\" when needed. Under 300 words."}
  ],
  "next": null
}/*FLOW_DATA_END*/;

const ICONS = {
  message: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.8c2.4.6 4 2.4 4 5.2"/>',
  book: '<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3.5 3 14.5 0 18c-3-3.5-3-14.5 0-18z"/>',
  file: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  plug: '<path d="M9 2v6M15 2v6"/><path d="M6 8h12v3a6 6 0 0 1-12 0z"/><path d="M12 17v5"/>',
  terminal: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/>',
  sparkles: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/>',
  package: '<path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>',
  rocket: '<path d="M14 4c3-1 6-1 6-1s0 3-1 6l-7 7-5-5z"/><path d="M9 10H5l3-3h4M14 15v4l3-3v-4"/><path d="M5 15c-1.5 1.5-2 5-2 5s3.5-.5 5-2"/>',
  handoff: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5 1.5 0 2.8.3 4 .8"/><path d="M16 15h6M19 12l3 3-3 3"/>',
  chevron: '<path d="M9 6l6 6-6 6"/>'
};

Object.assign(ICONS, {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  monitor: '<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'
});

/* Theme: "system" follows the device setting; "light"/"dark" override it. Saved per browser, shared with My Agents. */
function currentTheme() { return document.documentElement.dataset.theme || "system"; }
function setTheme(t) {
  if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { if (t === "system") localStorage.removeItem("agent-builder-theme"); else localStorage.setItem("agent-builder-theme", t); } catch (e) {}
}
function themeToggle() {
  const g = el("div", "theme"); g.setAttribute("role", "group"); g.setAttribute("aria-label", "Color theme");
  [["system", "monitor", "System"], ["light", "sun", "Light"], ["dark", "moon", "Dark"]].forEach(([v, ic, label]) => {
    const b = el("button"); b.type = "button"; b.title = label + " theme"; b.setAttribute("aria-label", label + " theme");
    b.setAttribute("aria-pressed", currentTheme() === v ? "true" : "false");
    b.append(icon(ic, "sm"), el("span", null, label));
    b.addEventListener("click", () => { setTheme(v); g.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false")); });
    g.append(b);
  });
  return g;
}

const DEFAULT_NEXT = [
  {icon: "eye", title: "Review this flow", detail: "Check it looks right, or tell me what to change."},
  {icon: "play", title: "Test drive", detail: "Chat with your agent before anything is built."},
  {icon: "package", title: "Build the files", detail: "Instructions, settings, and a how-to guide."},
  {icon: "download", title: "Set up", detail: "Installed for you, or copy-paste steps."},
  {icon: "check", title: "Test it", detail: "Run test cases, including your own examples."},
  {icon: "rocket", title: "Start using it", detail: "Try your first real request."}
];

const KINDS = {input: "Your request", think: "Thinking", tool: "Uses an ability", guard: "Safety check", output: "Result", handoff: "Hand-off / exception"};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function icon(name, cls) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("class", "i" + (cls ? " " + cls : ""));
  s.setAttribute("aria-hidden", "true");
  s.innerHTML = ICONS[name] || ICONS.sparkles;
  return s;
}
function kindClass(k) { return "k-" + (KINDS[k] ? k : "think"); }

function render(f) {
  const app = document.getElementById("app");
  const a = f.agent || {};
  document.title = (a.name || "Agent") + " · Flow Preview";

  // Hero
  const hero = el("div", "hero");
  hero.append(el("div", "badge", a.emoji || "🤖"));
  const ht = el("div", "htext");
  const pill = el("div", "pill"); pill.append(icon("eye", "sm"), document.createTextNode("Preview · nothing has been created yet"));
  ht.append(pill, el("h1", null, a.name || "Your agent"));
  if (a.tagline) ht.append(el("p", null, a.tagline));
  const meta = el("div", "meta");
  if (a.for) meta.append(el("span", null, "For: " + a.for));
  if (a.home) meta.append(el("span", null, "Lives in: " + a.home));
  if (a.id) meta.append(el("span", null, "id: " + a.id));
  if (meta.childNodes.length) ht.append(meta);
  hero.append(ht, themeToggle());
  app.append(hero);

  // What changed since the previous version
  const stepsArr = f.steps || [];
  const nNew = stepsArr.filter(x => x.change === "new").length, nUpd = stepsArr.filter(x => x.change === "updated").length;
  const removed = f.removed_steps || [];
  const gNew = Object.values(f.glance_new || {}).reduce((m, x) => m + x.length, 0);
  if (nNew || nUpd || removed.length || gNew) {
    const box = el("div", "changes"); box.setAttribute("role", "status");
    const ci = el("div", "ico"); ci.style.cssText = "display:grid;place-items:center;flex:none"; ci.append(icon("sparkles"));
    const tx = el("div");
    const parts = [];
    if (nNew) parts.push(nNew + " new step" + (nNew > 1 ? "s" : ""));
    if (nUpd) parts.push(nUpd + " changed step" + (nUpd > 1 ? "s" : ""));
    if (removed.length) parts.push(removed.length + " removed");
    if (gNew) parts.push(gNew + " new rule" + (gNew > 1 ? "s" : "") + " at a glance");
    tx.append(el("b", null, "Updated" + (f.revision ? " (version " + f.revision + ")" : "") + ": your changes are highlighted"),
              el("p", null, parts.join(" · ") + "."));
    if (removed.length) { const ul = el("ul"); removed.forEach(r => { const li = el("li"); li.append(document.createTextNode("Removed: "), el("s", null, r)); ul.append(li); }); tx.append(ul); }
    box.append(ci, tx); app.append(box);
  }

  // At a glance
  const g = f.glance || {};
  const groups = [["can", "check", "Can do", g.can], ["wont", "alert", "Won't do", g.wont], ["ask", "help", "Asks you first", g.asks_first]];
  if (groups.some(x => x[3] && x[3].length)) {
    const glance = el("div", "glance");
    for (const [cls, ic, label, items] of groups) {
      if (!items || !items.length) continue;
      const c = el("div", "gcard " + cls);
      const h = el("h3"); h.append(icon(ic, "sm"), document.createTextNode(label));
      const key = cls === "ask" ? "asks_first" : cls;
      const fresh = new Set(((f.glance_new || {})[key] || []).map(x => String(x).toLowerCase()));
      const ul = el("ul"); items.forEach(t => ul.append(el("li", fresh.has(String(t).toLowerCase()) ? "isnew" : null, t)));
      c.append(h, ul); glance.append(c);
    }
    app.append(glance);
  }

  // Flow
  const h2 = el("h2", "section"); h2.append(icon("sparkles"), document.createTextNode("How " + (a.name || "your agent") + " will work"));
  app.append(h2);
  const flow = el("div", "flow");
  const steps = f.steps || [];
  const usedKinds = new Set();
  steps.forEach((s, i) => {
    if (i > 0) { const c = el("div", "connector"); c.append(el("div"), el("div")); flow.append(c); }
    const row = el("div", "row");
    const card = el("div", "step " + kindClass(s.kind) + (s.change ? " changed" : ""));
    usedKinds.add(KINDS[s.kind] ? s.kind : "think");
    const ic = el("div", "ico"); ic.append(icon(s.icon));
    const body = el("div");
    const h4 = el("h4", null, s.title || "");
    if (s.change === "new" || s.change === "updated") h4.append(el("span", "chg " + s.change, s.change === "new" ? "New" : "Updated"));
    body.append(el("div", "num", "Step " + (i + 1) + " · " + (KINDS[s.kind] || KINDS.think)), h4);
    if (s.detail) body.append(el("p", null, s.detail));
    card.append(ic, body);
    row.append(card);
    if (s.branch) {
      const b = s.branch;
      const br = el("div", "branch " + kindClass(b.kind || "handoff"));
      usedKinds.add(KINDS[b.kind] ? b.kind : "handoff");
      const bi = el("div", "ico"); bi.append(icon(b.icon || "alert"));
      const bb = el("div"); bb.append(el("div", "when", b.when || "Otherwise"), el("div", "then", b.then || ""));
      br.append(bi, bb); row.append(br);
    } else {
      row.append(el("div"));
    }
    flow.append(row);
  });
  app.append(flow);

  // Next steps
  const nh = el("h2", "section"); nh.append(icon("rocket"), document.createTextNode("What happens next"));
  app.append(nh);
  const next = el("div", "next");
  const ns = (f.next && f.next.length) ? f.next : DEFAULT_NEXT;
  ns.forEach((n, i) => {
    if (i > 0) { const ch = el("div", "chev"); ch.append(icon("chevron")); next.append(ch); }
    const c = el("div", "nstep" + (i === 0 ? " current" : ""));
    if (i === 0) c.append(el("div", "here", "You are here"));
    const top = el("div", "top"); const ic = el("div", "ico"); ic.append(icon(n.icon, "sm")); top.append(ic, document.createTextNode(n.title || ""));
    c.append(top);
    if (n.detail) c.append(el("p", null, n.detail));
    next.append(c);
  });
  app.append(next);

  // Call to action
  const cta = el("div", "cta");
  const ci = el("div", "ico"); ci.style.cssText = "width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none"; ci.append(icon("message"));
  const cp = el("p");
  cp.append(document.createTextNode("Happy with this? Go back to the chat and reply "), el("b", null, "looks good"),
            document.createTextNode(", or tell me what to change. Nothing is built until you say so."));
  cta.append(ci, cp);
  app.append(cta);

  // Legend
  const legend = el("div", "legend");
  for (const k of Object.keys(KINDS)) {
    if (!usedKinds.has(k)) continue;
    const s = el("span", kindClass(k)); s.append(el("i"), document.createTextNode(KINDS[k])); legend.append(s);
  }
  app.append(legend);
}

render(FLOW);
</script>
</body>
</html>
